<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141f; --panel:#1b1e2e; --panel2:#20243a; --line:#2c3049;
  --ink:#ece9e2; --ink-dim:#a6a9bd; --ink-faint:#6c7089;
  --gold:#c9a24b; --gold-soft:rgba(201,162,75,.14);
  --teal:#2ba89a; --teal-soft:rgba(43,168,154,.14);
  --rose:#b76e79; --rose-soft:rgba(183,110,121,.14);
  --azure:#4c7fd1; --azure-soft:rgba(76,127,209,.14);
  --green:#34a574; --green-soft:rgba(52,165,116,.14); --amber:#e0a93e; --amber-soft:rgba(224,169,62,.14); --red:#d9614f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,162,75,.10), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0px, rgba(255,255,255,.018) 1px, transparent 1px, transparent 26px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0px, rgba(255,255,255,.014) 1px, transparent 1px, transparent 26px);
  color:var(--ink);font-family:Inter,-apple-system,sans-serif;min-height:100vh}
.app{max-width:640px;margin:0 auto;padding:18px 16px 48px;position:relative;z-index:1}
h1,h2,.serif{font-family:Fraunces,Georgia,serif}
::selection{background:var(--gold-soft)}
a{color:inherit;text-decoration:none}

#backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
#backdrop svg{width:min(1000px,165vw);height:min(1000px,165vw);opacity:.9}
.orb-ring{fill:none;stroke-width:1}
.orb-tick{stroke-width:1}
.orb-group{transform-origin:400px 400px}
.orb-spin-1{animation:orbSpin 85s linear infinite}
.orb-spin-2{animation:orbSpinRev 130s linear infinite}
.orb-spin-3{animation:orbSpin 175s linear infinite}
.orb-spin-4{animation:orbSpinRev 235s linear infinite}
@keyframes orbSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orbSpinRev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@media (prefers-reduced-motion: reduce){
  .orb-spin-1,.orb-spin-2,.orb-spin-3,.orb-spin-4{animation:none}
}
.star{fill:var(--gold);opacity:.5}

body.locked .app{display:none}
#lock{position:fixed;inset:0;background:rgba(18,20,31,.82);z-index:999;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}
body.locked #lock{display:flex}
.lock-box{width:100%;max-width:300px;text-align:center}
.lock-icon{font-size:34.5px;margin-bottom:10px}
.lock-box h2{font-size:23px;font-weight:600;margin-bottom:4px}
.lock-box p{font-size:14px;color:var(--ink-dim);margin-bottom:22px}
.lock-dots{display:flex;gap:10px;justify-content:center;margin-bottom:22px}
.lock-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);background:transparent;transition:all .1s}
.lock-dot.filled{background:var(--gold);border-color:var(--gold)}
.lock-dot.err{background:var(--red);border-color:var(--red)}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lock-key{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:20.5px;font-weight:600;padding:16px 0;border-radius:14px;cursor:pointer;font-family:Inter,sans-serif}
.lock-key:active{background:var(--gold-soft);border-color:var(--gold)}
.lock-key.wide{font-size:14px;color:var(--ink-dim)}
.lock-err{font-size:14px;color:var(--red);margin-top:14px;min-height:16px}

.hdr{text-align:center;padding:14px 0 24px}
.seal{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;position:relative;background:radial-gradient(circle at 35% 30%,#f3e2b3,#c9a24b 45%,#8a6a3f 85%);box-shadow:0 4px 16px rgba(201,162,75,.35), inset 0 0 0 1px rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.seal::before{content:'';position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(18,20,31,.35)}
.seal-mono{font-family:Fraunces,serif;font-weight:700;font-size:18.5px;color:#1b1207;letter-spacing:-.5px}
.hdr-eyebrow{font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:4px}
.hdr h1{font-size:31px;font-weight:600;letter-spacing:-.3px}
.hdr p{font-size:14px;color:var(--ink-dim);margin-top:6px;font-style:italic}
.hdr-rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto 0}

/* ── PORTAL TILES — now a compact grid, not full-width rows ── */
.portals{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
@media (min-width:520px){ .portals{grid-template-columns:repeat(3,1fr);} }
.portal{
  position:relative;border-radius:18px;padding:16px 14px;border:1px solid var(--line);
  background:var(--panel);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;
  display:flex;flex-direction:column;justify-content:space-between;min-height:150px;
}
.portal:active{transform:scale(.97)}
.portal-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.22);margin-bottom:10px}
.portal-eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.portal-name{font-family:Fraunces,serif;font-size:16px;font-weight:600;line-height:1.15}
.portal-desc{font-size:11.5px;color:var(--ink-dim);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.portal-arrow{position:absolute;bottom:14px;right:14px;font-size:16px;color:var(--ink-faint)}
.portal-edit{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-dim);cursor:pointer;z-index:2}
.portal-unset{font-size:10.5px;color:var(--amber);margin-top:4px;font-weight:600}

.portal-add{
  align-items:center;justify-content:center;text-align:center;gap:6px;
  background:transparent;border:1.5px dashed var(--line);color:var(--ink-dim);font-weight:600;font-size:13px;
}
.portal-add:hover{border-color:var(--gold);color:var(--gold)}
.portal-add .plus{font-size:26px;line-height:1;font-weight:400}

.footnote{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:26px;line-height:1.6}
.footnote span{text-decoration:underline;cursor:pointer;color:var(--ink-dim)}

/* ── EDIT / ADD MODAL ── */
#editOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:900;display:none;align-items:flex-end;justify-content:center}
#editOverlay.open{display:flex}
.edit-sheet{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:20px;border-top:1px solid var(--line)}
.edit-sheet h3{font-family:Fraunces,serif;font-size:19.5px;margin-bottom:4px}
.edit-sheet p.sub{font-size:13px;color:var(--ink-dim);margin-bottom:14px}
.edit-sheet label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:12px 0 5px}
.edit-sheet input,.edit-sheet textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:12px;font-size:15px;font-family:Inter,sans-serif}
.edit-sheet textarea{resize:vertical;min-height:60px}
.icon-name-row{display:flex;gap:10px}
.icon-name-row .icon-col{width:70px;flex-shrink:0}
.icon-name-row .icon-col input{text-align:center;font-size:22px;padding:10px 0}
.swatch-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.swatch.selected{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.edit-actions{display:flex;gap:8px;margin-top:18px}
.edit-actions button{flex:1;padding:12px 0;border-radius:12px;font-size:15.5px;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;font-family:Inter,sans-serif}
.edit-actions button.primary{background:var(--gold);border-color:var(--gold);color:#1b1207}
.edit-danger{margin-top:14px;text-align:center}
.edit-danger button{background:none;border:none;color:var(--red);font-size:13px;cursor:pointer;text-decoration:underline;font-family:Inter,sans-serif}
</style>
</head>

<script>
(function(){
  var g = document.getElementById('ticks');
  if(!g) return;
  var cx=400, cy=400, rOuter=372, rInner=360;
  var ns = 'http://www.w3.org/2000/svg';
  for(var i=0;i<24;i++){
    var a = (i/24) * Math.PI * 2;
    var x1 = cx + rOuter*Math.cos(a), y1 = cy + rOuter*Math.sin(a);
    var x2 = cx + rInner*Math.cos(a), y2 = cy + rInner*Math.sin(a);
    var line = document.createElementNS(ns,'line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    g.appendChild(line);
  }
})();
</script>
<script>
// ══════════════════════════════════════════════════════════
// PIN LOCK
// ══════════════════════════════════════════════════════════
var PIN_HASH = localStorage.getItem('vdgw_pin_hash') || '9989a37538faecc495bbe774b30fb447a1582b8f1bc14ac88dfd84996a7b799a'; // default: 1018
var lockEntry = '';
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function renderLockDots(){
  const dots = document.querySelectorAll('.lock-dot');
  dots.forEach((d,i)=> d.className = 'lock-dot' + (i < lockEntry.length ? ' filled' : ''));
}
function lockPress(digit){
  if(lockEntry.length >= 4) return;
  lockEntry += digit;
  renderLockDots();
  if(lockEntry.length === 4) checkPin();
}
function lockClear(){ lockEntry=''; document.getElementById('lockErr').textContent=''; renderLockDots(); }
function lockBack(){ lockEntry = lockEntry.slice(0,-1); renderLockDots(); }
async function checkPin(){
  const hash = await sha256(lockEntry);
  if(hash === PIN_HASH){
    localStorage.setItem('vdgw_unlocked','1');
    unlockApp();
  } else {
    document.getElementById('lockErr').textContent = 'Wrong PIN — try again';
    document.querySelectorAll('.lock-dot').forEach(d=>d.classList.add('err'));
    setTimeout(()=>{ lockEntry=''; renderLockDots(); document.querySelectorAll('.lock-dot').forEach(d=>d.classList.remove('err')); }, 350);
  }
}
function unlockApp(){
  document.getElementById('lock').style.display='none';
  document.body.classList.remove('locked');
}
function lockNow(){
  localStorage.removeItem('vdgw_unlocked');
  lockEntry=''; renderLockDots();
  document.getElementById('lock').style.display='flex';
  document.body.classList.add('locked');
}
async function promptChangePin(){
  var p1 = prompt('Set a new 4-digit shared PIN (both of you will use this one):');
  if(!p1) return;
  if(!/^\d{4}$/.test(p1)){ alert('PIN must be exactly 4 digits.'); return; }
  var p2 = prompt('Confirm the new PIN:');
  if(p1 !== p2){ alert('PINs did not match — nothing changed.'); return; }
  var hash = await sha256(p1);
  localStorage.setItem('vdgw_pin_hash', hash);
  PIN_HASH = hash;
  alert('PIN updated on this device. Set the same PIN on the other device so you both can get in.');
}
document.addEventListener('keydown', e=>{
  if(document.getElementById('lock').style.display==='none') return;
  if(e.key>='0' && e.key<='9') lockPress(e.key);
  if(e.key==='Backspace') lockBack();
});
if(localStorage.getItem('vdgw_unlocked')==='1'){ unlockApp(); }
else { document.body.classList.add('locked'); }

// ══════════════════════════════════════════════════════════
// PORTALS — built-in ones plus any you add from the UI.
// Everything (icon/name/desc/color/link) is editable, and new
// portals persist in this browser's localStorage.
// ══════════════════════════════════════════════════════════
var ACCENTS = ['#2ba89a','#c9a24b','#b76e79','#4c7fd1','#34a574','#e0a93e','#8b7fd1','#d9614f'];

var BUILTIN_PORTALS = [
  {id:'travel', icon:'<svg viewBox="0 0 512 512" width="24" height="24" fill="currentColor"><path d="M 256 70 C 275 70 290 95 290 130 L 290 195 L 410 260 L 410 295 L 290 255 L 290 330 L 335 365 L 335 395 L 256 375 L 177 395 L 177 365 L 222 330 L 222 255 L 102 295 L 102 260 L 222 195 L 222 130 C 222 95 237 70 256 70 Z"/></svg>', name:'Travel', eyebrow:'Trip Dashboard', desc:'Vegas, Alaska & the Danube — itineraries, packing, people, points.', accent:'#2ba89a'},
  {id:'points', icon:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="2.5" y="6" width="19" height="12" rx="2"/><rect x="2.5" y="9.2" width="19" height="2.6" opacity="0.5"/><rect x="5" y="15" width="6" height="1.4" opacity="0.5"/></svg>', name:'Points', eyebrow:'Rewards Portal', desc:'Cards, balances, specials, redemption strategy.', accent:'#c9a24b'},
  {id:'estate', icon:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><polygon points="12,3 19,8.5 5,8.5"/><rect x="4.5" y="9" width="15" height="1"/><rect x="6" y="10.5" width="1.3" height="7"/><rect x="8.7" y="10.5" width="1.3" height="7"/><rect x="11.3" y="10.5" width="1.3" height="7"/><rect x="14" y="10.5" width="1.3" height="7"/><rect x="16.7" y="10.5" width="1.3" height="7"/><rect x="4" y="18" width="16" height="1.4"/><rect x="3.3" y="19.8" width="17.4" height="1"/></svg>', name:'Estate', eyebrow:'Estate Portal', desc:'Estate planning & documents.', accent:'#b76e79'},
  {id:'ai', icon:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,17 9,11 13,15 21,6"/><polyline points="21,11 21,6 16,6"/></svg>', name:'AI', eyebrow:'AI Portal', desc:'Your AI workspace.', accent:'#4c7fd1'},
  {id:'photog', icon:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M9 3.5 L15 3.5 L16.3 5.5 L20 5.5 C21.1 5.5 22 6.4 22 7.5 L22 18 C22 19.1 21.1 20 20 20 L4 20 C2.9 20 2 19.1 2 18 L2 7.5 C2 6.4 2.9 5.5 4 5.5 L7.7 5.5 Z"/><circle cx="12" cy="13" r="4.3" fill="var(--panel,#1c1f2b)"/><circle cx="12" cy="13" r="3" fill="currentColor"/></svg>', name:"PopPop's Collection", eyebrow:'Equipment Sales Portal', desc:"Catalog, research, and list PopPop's camera gear for sale.", accent:'#34a574'},
  {id:'watchlist', icon:'🍿', name:'What to Watch', eyebrow:'Watchlist Portal', desc:"CVD movie & TV tracker — what we're watching, want to watch, and already have.", accent:'#e0a93e'},
  {id:'projects', icon:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2-2z"/></svg>', name:'Van Dyke Projects', eyebrow:'Project Tracker', desc:'Renovations, budgets, and every open action item in one place.', accent:'#d97a3f'}
];
var DEFAULT_LINKS = {
  travel: 'https://vandyke-travel-app.vercel.app',
  points: 'https://van-dyke-points.vercel.app',
  ai: 'https://ai-stocks-dashboard-sage.vercel.app',
  estate: 'https://estate-dashboard-mu.vercel.app',
  photog: 'https://poppop-photog.vercel.app',
  watchlist: 'https://what-to-watch-five-delta.vercel.app',
  projects: 'https://chateau-projects.vercel.app'
};

function getLinks(){
  var stored = {};
  try{ stored = JSON.parse(localStorage.getItem('vdgw_links')||'{}'); }catch(e){}
  return Object.assign({}, DEFAULT_LINKS, stored);
}
function saveLinks(l){ localStorage.setItem('vdgw_links', JSON.stringify(l)); }

function getCustomPortals(){
  try{ return JSON.parse(localStorage.getItem('vdgw_custom_portals')||'[]'); }catch(e){ return []; }
}
function saveCustomPortals(list){ localStorage.setItem('vdgw_custom_portals', JSON.stringify(list)); }

function getOverrides(){
  try{ return JSON.parse(localStorage.getItem('vdgw_overrides')||'{}'); }catch(e){ return {}; }
}
function saveOverrides(o){ localStorage.setItem('vdgw_overrides', JSON.stringify(o)); }

function getAllPortals(){
  var overrides = getOverrides();
  var builtin = BUILTIN_PORTALS.map(function(p){ return Object.assign({}, p, overrides[p.id] || {}); });
  return builtin.concat(getCustomPortals());
}

function hexToSoft(hex, alpha){
  hex = (hex||'#c9a24b').replace('#','');
  var r=parseInt(hex.substring(0,2),16), g=parseInt(hex.substring(2,4),16), b=parseInt(hex.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+(alpha||0.14)+')';
}

function renderPortals(){
  var links = getLinks();
  var all = getAllPortals();
  var wrap = document.getElementById('portalList');
  wrap.innerHTML = all.map(function(p){
    var url = links[p.id] || '';
    var soft = hexToSoft(p.accent);
    return '<div class="portal" onclick="tapPortal(\'' + p.id + '\')">'
      + '<div class="portal-edit" onclick="event.stopPropagation();openEdit(\'' + p.id + '\')">✎</div>'
      + '<div>'
      + '<div class="portal-icon" style="background:' + soft + ';color:' + p.accent + '">' + p.icon + '</div>'
      + '<div class="portal-eyebrow" style="color:' + p.accent + '">' + p.eyebrow + '</div>'
      + '<div class="portal-name">' + p.name + '</div>'
      + '<div class="portal-desc">' + p.desc + '</div>'
      + (url ? '' : '<div class="portal-unset">Not linked — tap to set URL</div>')
      + '</div>'
      + (url ? '<div class="portal-arrow">→</div>' : '')
      + '</div>';
  }).join('') + '<div class="portal portal-add" onclick="openAdd()"><span class="plus">+</span>Add a portal</div>';
}

function tapPortal(id){
  var links = getLinks();
  var url = links[id];
  if(url){ window.open(url, '_blank'); }
  else { openEdit(id); }
}

var editingId = null;
var editingIsNew = false;
var selectedAccent = ACCENTS[0];

function renderSwatches(){
  var row = document.getElementById('swatchRow');
  row.innerHTML = ACCENTS.map(function(c){
    return '<div class="swatch' + (c === selectedAccent ? ' selected' : '') + '" style="background:' + c + '" onclick="pickAccent(\'' + c + '\')"></div>';
  }).join('');
}
function pickAccent(c){ selectedAccent = c; renderSwatches(); }

function openAdd(){
  editingId = null;
  editingIsNew = true;
  document.getElementById('editTitle').textContent = 'Add a portal';
  document.getElementById('editSub').textContent = 'Create a new tile for something you access often.';
  document.getElementById('editIcon').value = '🔗';
  document.getElementById('editName').value = '';
  document.getElementById('editEyebrow').value = '';
  document.getElementById('editDesc').value = '';
  document.getElementById('editUrl').value = '';
  selectedAccent = ACCENTS[Math.floor(Math.random()*ACCENTS.length)];
  renderSwatches();
  document.getElementById('deleteWrap').style.display = 'none';
  document.getElementById('editOverlay').classList.add('open');
}

function openEdit(id){
  editingId = id;
  editingIsNew = false;
  var p = getAllPortals().find(function(x){ return x.id === id; });
  if(!p) return;
  var links = getLinks();
  document.getElementById('editTitle').textContent = 'Edit — ' + p.name;
  document.getElementById('editSub').textContent = "Update this portal's details or link.";
  document.getElementById('editIcon').value = p.icon;
  document.getElementById('editName').value = p.name;
  document.getElementById('editEyebrow').value = p.eyebrow;
  document.getElementById('editDesc').value = p.desc;
  document.getElementById('editUrl').value = links[id] || '';
  selectedAccent = p.accent;
  renderSwatches();
  document.getElementById('deleteWrap').style.display = id.indexOf('custom-') === 0 ? 'block' : 'none';
  document.getElementById('editOverlay').classList.add('open');
}

function closeEdit(){
  document.getElementById('editOverlay').classList.remove('open');
  editingId = null;
  editingIsNew = false;
}

function saveEdit(){
  var icon = document.getElementById('editIcon').value.trim() || '🔗';
  var name = document.getElementById('editName').value.trim() || 'Untitled';
  var eyebrow = document.getElementById('editEyebrow').value.trim() || 'Portal';
  var desc = document.getElementById('editDesc').value.trim();
  var val = document.getElementById('editUrl').value.trim();
  if(val && !/^https?:\/\//i.test(val)) val = 'https://' + val;

  var links = getLinks();

  if(editingIsNew){
    var id = 'custom-' + Date.now();
    var customs = getCustomPortals();
    customs.push({id:id, icon:icon, name:name, eyebrow:eyebrow, desc:desc, accent:selectedAccent});
    saveCustomPortals(customs);
    if(val) links[id] = val;
  } else if(editingId) {
    var isCustom = editingId.indexOf('custom-') === 0;
    if(isCustom){
      var customs2 = getCustomPortals();
      var idx = customs2.findIndex(function(x){ return x.id === editingId; });
      if(idx > -1){
        customs2[idx] = {id:editingId, icon:icon, name:name, eyebrow:eyebrow, desc:desc, accent:selectedAccent};
        saveCustomPortals(customs2);
      }
    } else {
      var overrides = getOverrides();
      overrides[editingId] = {icon:icon, name:name, eyebrow:eyebrow, desc:desc, accent:selectedAccent};
      saveOverrides(overrides);
    }
    if(val) links[editingId] = val; else delete links[editingId];
  }
  saveLinks(links);
  renderPortals();
  closeEdit();
}

function deletePortal(){
  if(!editingId || editingId.indexOf('custom-') !== 0) return;
  if(!confirm('Remove this portal? This only removes it from this browser — do the same on the other device if needed.')) return;
  var customs = getCustomPortals().filter(function(x){ return x.id !== editingId; });
  saveCustomPortals(customs);
  var links = getLinks();
  delete links[editingId];
  saveLinks(links);
  renderPortals();
  closeEdit();
}

renderPortals();
</script>
